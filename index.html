<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/inv.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Browse Pokemon TCG sets and current card market prices." />
    <meta name="theme-color" content="#1e1e2e" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#faf8f4" media="(prefers-color-scheme: light)" />
    <meta property="og:title" content="pokeINV" />
    <meta property="og:description" content="Browse Pokemon TCG sets and current card market prices." />
    <meta property="og:type" content="website" />
    <title>pokeINV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://assets.tcgdex.net" />
    <link href="https://fonts.googleapis.com/css2?family=Michroma&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      (function () {
        var preference = 'system'
        try {
          var stored = window.localStorage.getItem('inv-theme-preference')
          if (stored === 'system' || stored === 'light' || stored === 'dark') {
            preference = stored
          } else if (window.localStorage.getItem('inv-theme') === 'dark') {
            preference = 'dark'
          }
        } catch (error) {
          preference = 'system'
        }
        var dark = preference === 'dark' || (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="src/main.tsx"></script>
  </body>
</html>
